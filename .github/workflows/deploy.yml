name: Deploy to AWS

on:
  push:
    branches: [main]
    paths:
      - "BE/**"
      - "services/**"
      - "contracts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  NAME_PREFIX: myanalyst-prod

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run BE tests (Testcontainers uses the runner's built-in Docker)
        working-directory: ./BE
        run: ./mvnw test

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python service dependencies
        working-directory: ./services
        run: |
          pip install "./python-common[web,llm]"
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r knowledge/requirements.txt -r generation-worker/requirements.txt \
            -r market-data/requirements.txt -r qa/requirements.txt -r stt/requirements.txt

      # Each service is tested from its own directory (flat modules, like its container's /app).
      # generation-worker's message contract test reads ../../contracts, shared with the BE contract test.
      - name: Run Python service tests
        working-directory: ./services
        run: |
          for svc in python-common knowledge generation-worker market-data; do
            echo "::group::$svc"
            (cd "$svc" && python -m unittest discover -s tests -v)
            echo "::endgroup::"
          done

      - name: Scan dependencies for known vulnerabilities
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # The Python services build from ./services so their images can include services/python-common.
    # ECS services for the split Python services are added to Terraform in MSA stage 7.
    strategy:
      matrix:
        include:
          - name: be
            context: ./BE
            dockerfile: ./BE/Dockerfile
            container: be
          - name: knowledge
            context: ./services
            dockerfile: ./services/knowledge/Dockerfile
            container: knowledge
          - name: generation-worker
            context: ./services
            dockerfile: ./services/generation-worker/Dockerfile
            container: generation-worker
          - name: market-data
            context: ./services
            dockerfile: ./services/market-data/Dockerfile
            container: market-data
          - name: qa
            context: ./services
            dockerfile: ./services/qa/Dockerfile
            container: qa
          - name: stt
            context: ./services
            dockerfile: ./services/stt/Dockerfile
            container: stt
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ env.NAME_PREFIX }}-${{ matrix.name }}
          TAG: ${{ github.sha }}
        run: |
          docker build -f "${{ matrix.dockerfile }}" -t "$REGISTRY/$REPOSITORY:$TAG" -t "$REGISTRY/$REPOSITORY:latest" "${{ matrix.context }}"
          docker push "$REGISTRY/$REPOSITORY:$TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"

      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ env.NAME_PREFIX }}-${{ matrix.name }}" \
            --query taskDefinition > task-def.json

      - name: Update image in task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ matrix.container }}
          image: ${{ steps.ecr.outputs.registry }}/${{ env.NAME_PREFIX }}-${{ matrix.name }}:${{ github.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.NAME_PREFIX }}-${{ matrix.name }}
          cluster: ${{ env.NAME_PREFIX }}-cluster
          wait-for-service-stability: true
