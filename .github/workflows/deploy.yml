name: Deploy to AWS

# BE/RAG 이미지를 빌드해 ECR에 푸시하고, ECS 서비스에 새 태스크 정의로 배포한다.
# AWS 인증은 장기 액세스키 대신 OIDC로 infra/modules/github-oidc가 만든 역할을 임시로 assume한다
# (repo Settings > Secrets and variables > Actions에 AWS_DEPLOY_ROLE_ARN을
#  `terraform output github_actions_deploy_role_arn` 값으로 등록해야 동작함).
on:
  push:
    branches: [main]
    paths:
      - "BE/**"
      - "rag_server/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  id-token: write # OIDC 토큰 발급에 필요
  contents: read

env:
  AWS_REGION: ap-northeast-2
  # infra/envs/prod의 name_prefix("myanalyst-${var.environment}", 기본 environment=prod)와
  # 반드시 맞춰야 한다. environment를 바꿔 배포한다면 여기도 같이 바꿀 것.
  NAME_PREFIX: myanalyst-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: be
            context: ./BE
            container: be
          - name: rag-server
            context: ./rag_server
            container: rag-server
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ env.NAME_PREFIX }}-${{ matrix.name }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$REPOSITORY:$TAG" -t "$REGISTRY/$REPOSITORY:latest" "${{ matrix.context }}"
          docker push "$REGISTRY/$REPOSITORY:$TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"

      # describe-task-definition의 출력은 register-task-definition에 그대로 넣기엔
      # taskDefinitionArn/revision/status 등 부가 필드가 섞여 있는데, 아래 render/deploy
      # 액션 조합이 이 필드들을 알아서 걸러내고 이미지만 바꿔 새 리비전을 등록해준다.
      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ env.NAME_PREFIX }}-${{ matrix.name }}" \
            --query taskDefinition > task-def.json

      - name: Update image in task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ matrix.container }}
          image: ${{ steps.ecr.outputs.registry }}/${{ env.NAME_PREFIX }}-${{ matrix.name }}:${{ github.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.NAME_PREFIX }}-${{ matrix.name }}
          cluster: ${{ env.NAME_PREFIX }}-cluster
          wait-for-service-stability: true
