name: myanalyst

services:
  etcd:
    container_name: myanalyst-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # minio/minio is no longer published on Docker Hub (pulls fail with "repository does not exist").
  # Chainguard's build only ships `latest`, so it is pinned by digest. Its entrypoint is the minio binary
  # and it has no curl, so there is no container healthcheck; Milvus retries until object storage answers.
  minio:
    container_name: myanalyst-minio
    image: cgr.dev/chainguard/minio@sha256:cff197fef764642223ef9f4444c903d51aee9b544a7be8bc007fef6b7b00d136
    # The image runs as uid 65532, but a fresh named volume is owned by root ("file access denied").
    user: "0:0"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/minio_data
    command: ["server", "/minio_data", "--console-address", ":9001"]

  milvus:
    container_name: myanalyst-milvus
    image: milvusdb/milvus:v2.4.1
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio

  postgres:
    container_name: myanalyst-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: myanalystdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: myanalyst-redis
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Single-node KRaft broker (no ZooKeeper). Containers use kafka:19092, the host uses localhost:9092.
  # Topics are declared by the application (KafkaAdmin), so broker-side auto-creation is off to catch typos.
  kafka:
    container_name: myanalyst-kafka
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  opensearch:
    container_name: myanalyst-opensearch
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # --- Python services (built from ./services so they can share services/python-common) ---

  # Hybrid search API. Owns Milvus + OpenSearch and only reads them.
  knowledge:
    container_name: myanalyst-knowledge
    build:
      context: ./services
      dockerfile: knowledge/Dockerfile
    image: myanalyst/knowledge:local
    environment:
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: 9200
    ports:
      - "8001:8000"
    volumes:
      - ./processing:/data/processing:ro
    depends_on:
      milvus:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  # Same image as knowledge, run on demand: docker compose run --rm knowledge-ingest [python ingest.py bm25 --force]
  knowledge-ingest:
    image: myanalyst/knowledge:local
    profiles: ["ingest"]
    command: ["python", "ingest.py", "bm25"]
    environment:
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: 9200
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    volumes:
      - ./processing:/data/processing:ro
    depends_on:
      milvus:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  # Kafka consumer of generation.requested. No container_name so it can be scaled:
  #   docker compose up -d --scale generation-worker=2
  generation-worker:
    build:
      context: ./services
      dockerfile: generation-worker/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KNOWLEDGE_SERVICE_URL: http://knowledge:8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY를 .env에 설정하세요}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      KAFKA_MAX_POLL_INTERVAL_MS: ${WORKER_MAX_POLL_INTERVAL_MS:-300000}
    volumes:
      - worker_data:/app/data
    depends_on:
      kafka:
        condition: service_healthy

  market-data:
    container_name: myanalyst-market-data
    build:
      context: ./services
      dockerfile: market-data/Dockerfile
    ports:
      - "8002:8000"

  qa:
    container_name: myanalyst-qa
    build:
      context: ./services
      dockerfile: qa/Dockerfile
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY를 .env에 설정하세요}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    ports:
      - "8003:8000"

  stt:
    container_name: myanalyst-stt
    build:
      context: ./services
      dockerfile: stt/Dockerfile
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY를 .env에 설정하세요}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    ports:
      - "8004:8000"

  be:
    container_name: myanalyst-be
    build:
      context: ./BE
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/myanalystdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-root}
      MARKET_DATA_SERVICE_URL: http://market-data:8000
      QA_SERVICE_URL: http://qa:8000
      STT_SERVICE_URL: http://stt:8000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      INTERNAL_GATEWAY_TOKEN: ${INTERNAL_GATEWAY_TOKEN:-local-dev-internal-token}
    # Not published: clients reach the BE only through api-gateway.
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- Edge and identity (MSA stage 4) ---

  # The only public entry point (the FE talks to http://localhost:8080 as before).
  api-gateway:
    container_name: myanalyst-api-gateway
    build:
      context: ./services/api-gateway
    environment:
      PORT: 8080
      BE_URL: http://be:8080
      AUTH_SERVICE_URL: http://auth-service:8080
      USER_SERVICE_URL: http://user-service:8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      INTERNAL_GATEWAY_TOKEN: ${INTERNAL_GATEWAY_TOKEN:-local-dev-internal-token}
      LOGIN_RATE_PER_SECOND: ${LOGIN_RATE_PER_SECOND:-1}
      LOGIN_BURST: ${LOGIN_BURST:-5}
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy

  auth-service:
    container_name: myanalyst-auth-service
    build:
      context: ./services/auth-service
    environment:
      PORT: 8080
      USER_SERVICE_URL: http://user-service:8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-14d}
      INTERNAL_GATEWAY_TOKEN: ${INTERNAL_GATEWAY_TOKEN:-local-dev-internal-token}
    volumes:
      - auth_keys:/app/data
    depends_on:
      redis:
        condition: service_healthy

  user-service:
    container_name: myanalyst-user-service
    build:
      context: ./services/user-service
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/myanalystdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-root}
      INTERNAL_GATEWAY_TOKEN: ${INTERNAL_GATEWAY_TOKEN:-local-dev-internal-token}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  auth_keys:
  worker_data:
  etcd_data:
  minio_data:
  milvus_data:
  postgres_data:
  opensearch_data:
