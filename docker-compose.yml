name: myanalyst

# 로컬에서 BE / RAG(FastAPI) / Milvus / PostgreSQL을 컨테이너로 통합 기동해
# "3계층 디커플링" 아키텍처를 검증하기 위한 compose 파일입니다.
# 필요한 비밀값은 .env (repo 루트, .env.example 참고)에서 읽습니다.
#
# 실행: docker compose up --build
# FE(React)는 이 compose에 포함하지 않고 `cd FE && npm start`로 별도 실행합니다
# (BE가 8080으로 열려 있으면 FE 코드의 http://localhost:8080 호출이 그대로 동작합니다).

services:
  # --- 벡터 DB (Milvus) 의존 스택 ---
  etcd:
    container_name: myanalyst-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: myanalyst-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    container_name: myanalyst-milvus
    image: milvusdb/milvus:v2.4.1
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio

  # --- RDS(PostgreSQL)를 로컬에서 흉내내는 컨테이너 ---
  postgres:
    container_name: myanalyst-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: myanalystdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- ElastiCache(Redis)를 로컬에서 흉내내는 컨테이너: 뉴스/주가 캐시 ---
  redis:
    container_name: myanalyst-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- AI 연산 계층 (FastAPI + RAG 파이프라인) ---
  rag-server:
    container_name: myanalyst-rag-server
    build:
      context: ./rag_server
    environment:
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY를 .env에 설정하세요}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    ports:
      - "8000:8000"
    depends_on:
      milvus:
        condition: service_healthy

  # --- 백엔드 로직 계층 (Spring Boot) ---
  be:
    container_name: myanalyst-be
    build:
      context: ./BE
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/myanalystdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-root}
      RAG_SERVER_BASE_URL: http://rag-server:8000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rag-server:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  postgres_data:
