<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>검색 품질 개선 전후</title>
<!--
  README 3번 도전과제용 표. 수치는 services/knowledge/evals/results/public_benchmark_autorag.json과 같다.
  개선 전 = Dense 단독, 개선 후 = Dense + BM25 하이브리드(RRF).
  모든 수치 = 공개 벤치마크 AutoRAGRetrieval(mteb/AutoRAGRetrieval, 질의 114개, results/public_benchmark_autorag.json).
  질의마다 정답 페이지가 1개라 Recall@20과 Hit@20이 같으므로 Hit@20은 표에서 뺐다.
  PNG 만들기: python docs/images/build_table.py
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    color: #1F2328; background: #FFFFFF; width: 900px; padding: 24px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 16px; }
  thead th {
    background: #F3F4F6; color: #5F6673; font-weight: 600; font-size: 14px;
    padding: 13px 18px; border-top: 1px solid #D5D9E0; border-bottom: 1px solid #D5D9E0;
  }
  th:first-child, td:first-child { text-align: left; width: 50%; }
  th, td { text-align: center; }
  td { padding: 17px 18px; border-bottom: 1px solid #D5D9E0; }
  td .name { display: inline-block; width: 92px; }
  td .desc { font-size: 13px; }
  td.before { color: #5F6673; }
  td.after { font-weight: 800; }
</style>
</head>
<body>
  <table>
    <thead>
      <tr><th>지표</th><th>개선 전</th><th>개선 후</th></tr>
    </thead>
    <tbody>
      <tr><td><span class="name">Hit@10</span><span class="desc">(상위 10개 안에 정답 포함 여부)</span></td><td class="before">63.2%</td><td class="after">94.7%</td></tr>
      <tr><td><span class="name">Recall@20</span><span class="desc">(정답 문서 중 상위 20개에서 찾은 비율)</span></td><td class="before">71.9%</td><td class="after">99.1%</td></tr>
      <tr><td><span class="name">nDCG@10</span><span class="desc">(정답이 상위 10개 중 얼마나 위에 있는지)</span></td><td class="before">0.456</td><td class="after">0.708</td></tr>
    </tbody>
  </table>
</body>
</html>
