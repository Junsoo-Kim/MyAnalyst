server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          # 공개키는 auth-service에서 받아 캐시한다. 요청마다 auth-service를 부르지 않으므로 auth가 내려가도
          # 이미 발급된 토큰은 계속 검증된다.
          jwk-set-uri: ${AUTH_SERVICE_URL:http://localhost:8083}/.well-known/jwks.json
  cloud:
    gateway:
      httpclient:
        # 내려간 서비스로 가는 요청이 30초(기본값)씩 매달리지 않게 한다.
        connect-timeout: 2000
      routes:
        # 로그인: IP당 초당 1회, 순간 5회까지. 넘으면 429.
        - id: auth-login
          uri: ${AUTH_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/sessions
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${LOGIN_RATE_PER_SECOND:1}
                redis-rate-limiter.burstCapacity: ${LOGIN_BURST:5}
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@clientIpKeyResolver}"
        - id: auth
          uri: ${AUTH_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/sessions,/auth/**
        - id: user-signup
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/users
            - Method=POST
        # MSA 5단계: 보고서에 딸린 기능은 report.created 사본으로 동작하는 서비스가 받는다. BE catch-all보다 앞에 둔다.
        - id: notification
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/report-jobs/*/events
            - Method=GET
        - id: dictionary
          uri: ${DICTIONARY_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/reports/*/dictionary
            - Method=GET
        - id: chat
          uri: ${CHAT_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/chat,/chat/stt,/reports/*/chat
        # MSA 6단계: BE 모놀리스가 사라지고 보고서·생성 Job은 각 서비스가, 시세·뉴스는 market-data가 직접 받는다.
        # catch-all은 없다. 어느 라우트에도 맞지 않는 경로는 Gateway가 404로 끝낸다.
        - id: generation
          uri: ${GENERATION_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/report-jobs,/report-jobs/**
        - id: report
          uri: ${REPORT_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/reports,/reports/**
        # market-data는 Python 서비스라 X-Internal-Token을 보지 않는다. 그래서 조회 경로만 연다(/dictionaries 등 내부 API 제외).
        - id: market-data
          uri: ${MARKET_DATA_SERVICE_URL:http://localhost:8002}
          predicates:
            - Path=/news/*,/stocks/*,/stocks/*/chart-image
            - Method=GET

app:
  jwt:
    issuer: myanalyst-auth
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  internal-token: ${INTERNAL_GATEWAY_TOKEN:local-dev-internal-token}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
