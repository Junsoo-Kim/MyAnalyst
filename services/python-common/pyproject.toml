[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myanalyst-common"
version = "0.1.0"
description = "Shared observability, LLM client and web helpers for MyAnalyst Python services"
requires-python = ">=3.11"
dependencies = [
    "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.100.0"]
llm = ["openai>=1.0.0"]

[tool.setuptools]
packages = ["myanalyst_common"]
