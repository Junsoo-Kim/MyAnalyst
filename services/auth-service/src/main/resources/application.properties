spring.application.name=auth-service
server.port=${PORT:8083}

app.services.user.base-url=${USER_SERVICE_URL:http://localhost:8082}
app.services.user.timeout=3s

app.jwt.issuer=myanalyst-auth
app.jwt.key-file=${JWT_KEY_FILE:./data/jwt-signing-key.json}
app.jwt.access-ttl=${JWT_ACCESS_TTL:15m}
app.jwt.refresh-ttl=${JWT_REFRESH_TTL:14d}
# true behind HTTPS. Local docker-compose serves plain HTTP, where Secure cookies would never be sent back.
app.cookies.secure=${COOKIE_SECURE:false}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

# Shared secret the gateway adds to every forwarded request (X-Internal-Token).
app.internal-token=${INTERNAL_GATEWAY_TOKEN:local-dev-internal-token}
