spring.application.name=report-service
server.port=${PORT:8088}

# Owns the reports table (report_db; MSA stage 6 gave each service its own database).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/report_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=
spring.jpa.open-in-view=false

# Spring Modulith event publication registry (Transactional Outbox).
# Publications are stored in the same transaction as the business change and re-delivered until a listener completes.
# The JDBC store creates its own table (serialized_event TEXT); the JPA store left schema creation to Hibernate,
# which produced varchar(255) and rejected larger events.
spring.modulith.events.jdbc.schema-initialization.enabled=true
spring.modulith.events.republish-outstanding-events-on-restart=true
app.events.resubmit-after=30s
app.events.resubmit-interval-ms=30000

# Kafka. Events marked @Externalized are sent through the registry above after commit.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Durable consumer groups must not miss events produced before they first joined.
spring.kafka.consumer.auto-offset-reset=earliest
# Fail a send quickly while the broker is down; the publication stays incomplete and is resubmitted.
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=30000
spring.kafka.producer.properties.request.timeout.ms=10000
# Listeners and topic creation must not be part of application startup: an unreachable broker would stop the
# whole API from booting. KafkaListenerStarter starts them in the background and keeps retrying.
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false
spring.kafka.admin.fail-fast=false
app.kafka.listener-starter.retry-interval-ms=10000
app.kafka.topic-partitions=3
app.kafka.topic-replicas=${KAFKA_TOPIC_REPLICAS:1}
app.kafka.consumer.max-retries=3
app.kafka.consumer.initial-backoff-ms=1000

# Behind api-gateway: CORS and JWT verification happen there. The gateway forwards the authenticated user as
# X-User-Id together with this shared secret; requests without it are rejected.
app.internal-token=${INTERNAL_GATEWAY_TOKEN:local-dev-internal-token}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:1.0}
management.metrics.tags.application=${spring.application.name}

springdoc.swagger-ui.path=/swagger-ui.html
