spring.application.name=user-service
server.port=${PORT:8082}

# Owns the Users table. Until MSA stage 6 it lives in the shared database; the table is not touched by BE any more.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/myanalystdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

# Shared secret the gateway adds to every forwarded request (X-Internal-Token).
app.internal-token=${INTERNAL_GATEWAY_TOKEN:local-dev-internal-token}
