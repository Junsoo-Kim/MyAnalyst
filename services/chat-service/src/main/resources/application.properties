spring.application.name=chat-service
server.port=${PORT:8086}

# Own database (chat_db) in the shared PostgreSQL instance (MSA stage 6).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chat_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Synchronous calls: report Q&A and speech-to-text.
app.services.qa.base-url=${QA_SERVICE_URL:http://localhost:8003}
app.services.stt.base-url=${STT_SERVICE_URL:http://localhost:8004}
app.services.connect-timeout=5s
app.services.response-timeout=120s

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Values are read as raw JSON bytes and dispatched on the event-type header, so the consumer does not depend on
# the producer's Java class names (__TypeId__).
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
# Only used to forward failed records to <topic>.DLT unchanged.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
spring.kafka.producer.properties.max.block.ms=5000
app.kafka.consumer.max-retries=3
app.kafka.consumer.initial-backoff-ms=1000
spring.kafka.listener.auto-startup=false
app.kafka.listener-starter.retry-interval-ms=10000

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

# Shared secret the gateway adds to every forwarded request (X-Internal-Token).
app.internal-token=${INTERNAL_GATEWAY_TOKEN:local-dev-internal-token}
