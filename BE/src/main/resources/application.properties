spring.application.name=myanalyst

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/myanalystdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=
spring.jpa.open-in-view=false

# The RAG service is deliberately configurable so the API server does not depend on localhost.
app.rag.base-url=${RAG_SERVER_URL:http://localhost:8000}
app.rag.connect-timeout=5s
app.rag.response-timeout=180s

# In-process dispatcher. The first run is triggered by an event; the poller only handles delayed retries and expired leases.
app.report-jobs.poll-interval-ms=1000
app.report-jobs.max-attempts=3
app.report-jobs.lease-seconds=300

# Spring Modulith event publication registry (replaces the hand-written outbox relay).
# Publications are stored in the same transaction as the business change and re-delivered until a listener completes.
# The JDBC store creates its own table (serialized_event TEXT); the JPA store left schema creation to Hibernate,
# which produced varchar(255) and rejected larger events.
spring.modulith.events.jdbc.schema-initialization.enabled=true
spring.modulith.events.republish-outstanding-events-on-restart=true
app.events.resubmit-after=30s
app.events.resubmit-interval-ms=30000

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.redis.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:1.0}
management.metrics.tags.application=${spring.application.name}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

springdoc.swagger-ui.path=/swagger-ui.html
