spring.application.name=myanalyst

# 컨테이너/클라우드 환경에서는 아래 값들을 환경 변수로 주입합니다.
# (Spring Boot의 relaxed binding: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, ... 로 오버라이드 가능)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/myanalystdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=
spring.jpa.open-in-view=false

# RAG(FastAPI) 서버 주소 - 로컬 실행 시 localhost:8000, 컨테이너/클라우드에서는
# 서비스 디스커버리 이름(docker-compose 서비스명, ECS Service Connect 이름 등)으로 오버라이드
rag.server.base-url=${RAG_SERVER_BASE_URL:http://localhost:8000}

# 프론트엔드 Origin - 컨테이너/클라우드 환경에서 오버라이드
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ALB/ECS 헬스체크 및 컨테이너 오케스트레이션용 Actuator 엔드포인트
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.redis.enabled=true

# Redis(ElastiCache) - 뉴스/주가 크롤링 결과 캐싱용.
# 로컬 실행 시 localhost:6379, docker-compose/ECS에서는 REDIS_HOST/REDIS_PORT로 오버라이드.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
