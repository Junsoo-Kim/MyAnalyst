spring.application.name=myanalyst

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/myanalystdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=
spring.jpa.open-in-view=false

# Synchronous calls to other services (report generation is not one of them: it goes through Kafka).
app.services.market-data.base-url=${MARKET_DATA_SERVICE_URL:http://localhost:8002}
app.services.qa.base-url=${QA_SERVICE_URL:http://localhost:8003}
app.services.stt.base-url=${STT_SERVICE_URL:http://localhost:8004}
app.services.connect-timeout=5s
app.services.response-timeout=120s

# Report jobs are executed by the Python generation-worker (Kafka). The poller here only requeues delayed retries
# and recovers RUNNING jobs whose lease expired, i.e. no progress event from the worker for lease-seconds.
app.report-jobs.poll-interval-ms=1000
app.report-jobs.max-attempts=3
app.report-jobs.lease-seconds=300

# Spring Modulith event publication registry (replaces the hand-written outbox relay).
# Publications are stored in the same transaction as the business change and re-delivered until a listener completes.
# The JDBC store creates its own table (serialized_event TEXT); the JPA store left schema creation to Hibernate,
# which produced varchar(255) and rejected larger events.
spring.modulith.events.jdbc.schema-initialization.enabled=true
spring.modulith.events.republish-outstanding-events-on-restart=true
app.events.resubmit-after=30s
app.events.resubmit-interval-ms=30000

# Kafka. Events marked @Externalized are sent through the registry above (Transactional Outbox) after commit.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Durable consumer groups must not miss events produced before they first joined.
spring.kafka.consumer.auto-offset-reset=earliest
# Fail a send quickly while the broker is down; the publication stays incomplete and is resubmitted.
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=30000
spring.kafka.producer.properties.request.timeout.ms=10000
# Listeners and topic creation must not be part of application startup: an unreachable broker would stop the
# whole API from booting. KafkaListenerStarter starts them in the background and keeps retrying.
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false
spring.kafka.admin.fail-fast=false
app.kafka.listener-starter.retry-interval-ms=10000
app.kafka.topic-partitions=3
app.kafka.topic-replicas=${KAFKA_TOPIC_REPLICAS:1}
app.kafka.consumer.max-retries=3
app.kafka.consumer.initial-backoff-ms=1000

# BE sits behind api-gateway (MSA stage 4): CORS and JWT verification happen there. The gateway forwards the
# authenticated user as X-User-Id together with this shared secret; requests without it are rejected.
app.internal-token=${INTERNAL_GATEWAY_TOKEN:local-dev-internal-token}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.redis.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:1.0}
management.metrics.tags.application=${spring.application.name}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

springdoc.swagger-ui.path=/swagger-ui.html
