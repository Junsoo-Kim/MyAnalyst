spring.application.name=myanalyst
spring.datasource.url=jdbc:postgresql://localhost:5432/myanalystdb
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=
spring.jpa.open-in-view=false

# The RAG service is deliberately configurable so the API server does not depend on localhost.
app.rag.base-url=${RAG_SERVER_URL:http://localhost:8000}
app.rag.connect-timeout=5s
app.rag.response-timeout=180s

# Durable in-process dispatcher for local development. Production can replace this with an SQS consumer.
app.report-jobs.poll-interval-ms=1000
app.report-jobs.max-attempts=3
app.report-jobs.lease-seconds=300
app.report-jobs.outbox-max-attempts=5

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:1.0}
management.metrics.tags.application=${spring.application.name}

springdoc.swagger-ui.path=/swagger-ui.html
